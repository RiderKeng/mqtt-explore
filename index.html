<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MQTT Explorer | Paul IoT Lab</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    header {
      padding: 16px;
      background: #111827;
      border-bottom: 1px solid #334155;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      color: #94a3b8;
      font-size: 13px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 14px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    h3 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
      color: #cbd5e1;
      font-size: 13px;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 15px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
    }

    .btn-secondary {
      background: #334155;
    }

    .btn-danger {
      background: #991b1b;
      border-color: #991b1b;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    #status {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #475569;
      font-size: 13px;
    }

    .connected {
      background: #166534 !important;
    }

    .disconnected {
      background: #991b1b !important;
    }

    .small {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }

    /* TOOLBAR */

    .topic-toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
    }

    .topic-toolbar button {
      width: auto;
    }

    .view-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }

    .view-toggle button.active {
      background: #2563eb;
      border-color: #2563eb;
    }

    /* LIST */

    .topic {
      border-bottom: 1px solid #334155;
      padding: 10px 4px;
    }

    .topic-name {
      color: #60a5fa;
      font-family: monospace;
      word-break: break-all;
      font-size: 14px;
    }

    .payload {
      margin-top: 4px;
      color: #f8fafc;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .meta {
      margin-top: 4px;
      color: #94a3b8;
      font-size: 11px;
    }

    /* TREE */

    .tree-node {
      margin-left: 12px;
      font-family: monospace;
    }

    .tree-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 6px 0;
      min-width: 0;
    }

    .tree-toggle {
      width: 22px;
      flex: 0 0 22px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
    }

    .tree-folder {
      color: #93c5fd;
      font-weight: bold;
    }

    .tree-leaf {
      color: #60a5fa;
    }

    .tree-payload {
      color: #f8fafc;
      word-break: break-word;
      margin-left: 4px;
    }

    .tree-meta {
      margin-left: 28px;
      color: #64748b;
      font-size: 10px;
      padding-bottom: 4px;
    }

    .tree-children.hidden {
      display: none;
    }

    .empty {
      color: #64748b;
      text-align: center;
      padding: 30px 5px;
    }

    @media (max-width: 650px) {
      .row,
      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>MQTT Explorer</h1>
  <p>Paul IoT Lab · MQTT testing & debugging tool</p>
</header>

<div class="container">

  <!-- CONNECTION -->

  <div class="card">
    <h3>Connection Profile</h3>

    <label>Saved Profile</label>
    <select id="profileSelect"></select>

    <div class="buttons">
      <button class="btn-secondary" onclick="newProfile()">New Profile</button>
      <button class="btn-danger" onclick="deleteProfile()">Delete Profile</button>
    </div>

    <label>Profile Name</label>
    <input id="profileName" placeholder="AMW EMQX" />

    <label>Hostname</label>
    <input id="host" placeholder="xxxx.emqxsl.com" />

    <div class="row">
      <div>
        <label>WSS Port</label>
        <input id="port" type="number" value="8084" />
      </div>

      <div>
        <label>Subscribe Topic</label>
        <input id="subscription" value="amw/#" />
      </div>
    </div>

    <label>Client ID</label>
    <input id="clientId" placeholder="paul-mqtt-test-01" />

    <div class="row">
      <div>
        <label>Username</label>
        <input id="username" />
      </div>

      <div>
        <label>Password</label>
        <input id="password" type="password" />
      </div>
    </div>

    <div class="buttons">
      <button class="btn-secondary" onclick="saveProfile()">
        Save Profile
      </button>

      <button class="btn-primary" id="connectBtn" onclick="toggleConnection()">
        Connect
      </button>
    </div>

    <div id="status">Disconnected</div>

    <p class="small">
      Profile จะจำ Host, Port, Username, Client ID และ Subscribe Topic
      แต่จะไม่เก็บ Password ลง browser
    </p>
  </div>

  <!-- LIVE TOPICS -->

  <div class="card">
    <h3>Live Topics</h3>

    <div class="topic-toolbar">
      <input
        id="search"
        placeholder="Search topic..."
        oninput="renderTopics()"
      />

      <button class="btn-secondary" onclick="clearTopics()">Clear</button>
    </div>

    <div class="view-toggle">
      <button
        id="listBtn"
        class="active"
        onclick="setView('list')"
      >
        List
      </button>

      <button
        id="treeBtn"
        onclick="setView('tree')"
      >
        Tree
      </button>
    </div>

    <div id="topicCount" class="small">0 topics</div>

    <div id="topics">
      <div class="empty">Waiting for MQTT messages...</div>
    </div>
  </div>

  <!-- PUBLISH -->

  <div class="card">
    <h3>Publish Test Message</h3>

    <label>Topic</label>
    <input id="pubTopic" placeholder="test/mqtt" />

    <label>Payload</label>
    <textarea id="pubPayload">hello</textarea>

    <div class="row">
      <div>
        <label>QoS</label>
        <select id="pubQos">
          <option value="0">0</option>
          <option value="1">1</option>
        </select>
      </div>

      <div>
        <label>Retain</label>
        <select id="pubRetain">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </div>
    </div>

    <button
      class="btn-primary"
      style="margin-top:14px"
      onclick="publishMessage()"
    >
      Publish
    </button>
  </div>

</div>

<script>
  let client = null;
  let topics = {};
  let profiles = [];
  let currentView = "list";
  let collapsed = {};

  const PROFILE_KEY = "paul_mqtt_profiles";

  // ========================================
  // PROFILE
  // ========================================

  function loadProfiles() {
    try {
      profiles = JSON.parse(localStorage.getItem(PROFILE_KEY)) || [];
    } catch {
      profiles = [];
    }

    refreshProfileSelect();

    if (profiles.length > 0) {
      loadProfile(0);
    } else {
      newProfile();
    }
  }

  function refreshProfileSelect() {
    const select = document.getElementById("profileSelect");
    select.innerHTML = "";

    profiles.forEach((profile, index) => {
      const option = document.createElement("option");
      option.value = index;
      option.textContent = profile.name || `Profile ${index + 1}`;
      select.appendChild(option);
    });

    select.onchange = () => {
      loadProfile(Number(select.value));
    };
  }

  function newProfile() {
    setValue("profileName", "");
    setValue("host", "");
    setValue("port", "8084");
    setValue("subscription", "amw/#");

    setValue(
      "clientId",
      "mqtt-test-" + Math.floor(Math.random() * 10000)
    );

    setValue("username", "");
    setValue("password", "");

    document.getElementById("profileSelect").value = "";
  }

  function saveProfile() {
    const profile = {
      name: value("profileName"),
      host: value("host"),
      port: value("port"),
      subscription: value("subscription") || "amw/#",
      clientId: value("clientId"),
      username: value("username")
    };

    if (!profile.name) {
      alert("Please enter Profile Name");
      return;
    }

    let index = profiles.findIndex(
      p => p.name === profile.name
    );

    if (index >= 0) {
      profiles[index] = profile;
    } else {
      profiles.push(profile);
      index = profiles.length - 1;
    }

    localStorage.setItem(
      PROFILE_KEY,
      JSON.stringify(profiles)
    );

    refreshProfileSelect();

    document.getElementById("profileSelect").value = index;

    alert("Profile saved");
  }

  function loadProfile(index) {
    const p = profiles[index];

    if (!p) return;

    setValue("profileName", p.name);
    setValue("host", p.host);
    setValue("port", p.port || "8084");
    setValue("subscription", p.subscription || "amw/#");
    setValue("clientId", p.clientId);
    setValue("username", p.username);

    setValue("password", "");
  }

  function deleteProfile() {
    const index =
      Number(document.getElementById("profileSelect").value);

    if (!profiles[index]) return;

    if (!confirm("Delete this profile?")) return;

    profiles.splice(index, 1);

    localStorage.setItem(
      PROFILE_KEY,
      JSON.stringify(profiles)
    );

    refreshProfileSelect();

    if (profiles.length > 0) {
      loadProfile(0);
    } else {
      newProfile();
    }
  }

  // ========================================
  // MQTT
  // ========================================

  function toggleConnection() {
    if (client && client.connected) {
      client.end(true);
      return;
    }

    connectMQTT();
  }

  function connectMQTT() {
    const host = value("host").trim();
    const port = value("port").trim();
    const username = value("username");
    const password = value("password");
    const clientId = value("clientId").trim();

    const subscription =
      value("subscription").trim() || "amw/#";

    if (!host || !port || !clientId) {
      alert("Host, Port and Client ID are required");
      return;
    }

    const url = `wss://${host}:${port}/mqtt`;

    setStatus("Connecting...", false);

    const options = {
      clientId: clientId,
      username: username || undefined,
      password: password || undefined,
      protocolVersion: 4,
      clean: false,
      reconnectPeriod: 3000,
      connectTimeout: 10000,
      keepalive: 60
    };

    client = mqtt.connect(url, options);

    client.on("connect", function() {
      setStatus("Connected", true);

      document.getElementById("connectBtn").textContent =
        "Disconnect";

      client.subscribe(
        subscription,
        { qos: 0 },
        function(err) {
          if (err) {
            alert(
              "Subscribe failed: " +
              (err.message || "Unknown error")
            );
          }
        }
      );
    });

    client.on("message", function(topic, message, packet) {
      topics[topic] = {
        payload: message.toString(),
        qos: packet.qos,
        retain: packet.retain,
        time: new Date().toLocaleString(),
        count: (topics[topic]?.count || 0) + 1
      };

      renderTopics();
    });

    client.on("reconnect", function() {
      setStatus("Reconnecting...", false);
    });

    client.on("offline", function() {
      setStatus("Offline", false);
    });

    client.on("close", function() {
      setStatus("Disconnected", false);

      document.getElementById("connectBtn").textContent =
        "Connect";
    });

    client.on("error", function(err) {
      console.error(err);
      setStatus("Error: " + err.message, false);
    });
  }

  // ========================================
  // VIEW
  // ========================================

  function setView(view) {
    currentView = view;

    document.getElementById("listBtn")
      .classList.toggle("active", view === "list");

    document.getElementById("treeBtn")
      .classList.toggle("active", view === "tree");

    renderTopics();
  }

  function renderTopics() {
    document.getElementById("topicCount").textContent =
      `${Object.keys(topics).length} topics`;

    if (currentView === "tree") {
      renderTree();
    } else {
      renderList();
    }
  }

  // ========================================
  // LIST
  // ========================================

  function renderList() {
    const container = document.getElementById("topics");

    const filter =
      value("search").toLowerCase();

    const names = Object.keys(topics)
      .filter(t => t.toLowerCase().includes(filter))
      .sort();

    if (names.length === 0) {
      container.innerHTML =
        '<div class="empty">No matching topics</div>';
      return;
    }

    container.innerHTML = "";

    names.forEach(topic => {
      const item = topics[topic];

      const div = document.createElement("div");
      div.className = "topic";

      const topicEl = document.createElement("div");
      topicEl.className = "topic-name";
      topicEl.textContent = topic;

      const payloadEl = document.createElement("div");
      payloadEl.className = "payload";
      payloadEl.textContent = item.payload;

      const meta = document.createElement("div");
      meta.className = "meta";

      meta.textContent =
        `${item.time} | QoS ${item.qos}` +
        ` | Retain ${item.retain}` +
        ` | Count ${item.count}`;

      div.appendChild(topicEl);
      div.appendChild(payloadEl);
      div.appendChild(meta);

      container.appendChild(div);
    });
  }

  // ========================================
  // TREE
  // ========================================

  function buildTree() {
    const root = {};

    Object.keys(topics).forEach(fullTopic => {
      const parts = fullTopic.split("/");
      let node = root;

      parts.forEach((part, index) => {
        if (!node[part]) {
          node[part] = {
            __children: {}
          };
        }

        if (index === parts.length - 1) {
          node[part].__topic = fullTopic;
          node[part].__data = topics[fullTopic];
        }

        node = node[part].__children;
      });
    });

    return root;
  }

  function renderTree() {
    const container = document.getElementById("topics");

    const filter =
      value("search").toLowerCase();

    container.innerHTML = "";

    const tree = buildTree();

    const visible = renderTreeLevel(
      tree,
      container,
      "",
      filter
    );

    if (!visible) {
      container.innerHTML =
        '<div class="empty">No matching topics</div>';
    }
  }

  function renderTreeLevel(nodes, parent, path, filter) {
    let anyVisible = false;

    Object.keys(nodes).sort().forEach(name => {
      const node = nodes[name];

      const fullPath =
        path ? `${path}/${name}` : name;

      const hasChildren =
        Object.keys(node.__children).length > 0;

      const topicMatch =
        fullPath.toLowerCase().includes(filter);

      const childMatch =
        subtreeMatches(node.__children, filter, fullPath);

      if (
        filter &&
        !topicMatch &&
        !childMatch
      ) {
        return;
      }

      anyVisible = true;

      const wrapper = document.createElement("div");
      wrapper.className = "tree-node";

      const row = document.createElement("div");
      row.className = "tree-row";

      const toggle = document.createElement("button");
      toggle.className = "tree-toggle";

      if (hasChildren) {
        toggle.textContent =
          collapsed[fullPath] ? "▶" : "▼";

        toggle.onclick = () => {
          collapsed[fullPath] =
            !collapsed[fullPath];

          renderTree();
        };
      } else {
        toggle.textContent = "•";
      }

      const label = document.createElement("span");

      if (hasChildren) {
        label.className = "tree-folder";
      } else {
        label.className = "tree-leaf";
      }

      label.textContent = name;

      row.appendChild(toggle);
      row.appendChild(label);

      if (node.__data) {
        const payload = document.createElement("span");
        payload.className = "tree-payload";
        payload.textContent =
          ` = ${node.__data.payload}`;

        row.appendChild(payload);
      }

      wrapper.appendChild(row);

      if (node.__data) {
        const meta = document.createElement("div");
        meta.className = "tree-meta";

        meta.textContent =
          `${node.__data.time} | QoS ${node.__data.qos}` +
          ` | Retain ${node.__data.retain}` +
          ` | Count ${node.__data.count}`;

        wrapper.appendChild(meta);
      }

      if (hasChildren) {
        const childContainer =
          document.createElement("div");

        childContainer.className =
          "tree-children" +
          (collapsed[fullPath] ? " hidden" : "");

        renderTreeLevel(
          node.__children,
          childContainer,
          fullPath,
          filter
        );

        wrapper.appendChild(childContainer);
      }

      parent.appendChild(wrapper);
    });

    return anyVisible;
  }

  function subtreeMatches(nodes, filter, path) {
    if (!filter) return true;

    for (const name of Object.keys(nodes)) {
      const node = nodes[name];

      const fullPath =
        path ? `${path}/${name}` : name;

      if (
        fullPath.toLowerCase().includes(filter)
      ) {
        return true;
      }

      if (
        subtreeMatches(
          node.__children,
          filter,
          fullPath
        )
      ) {
        return true;
      }
    }

    return false;
  }

  function clearTopics() {
    topics = {};
    renderTopics();
  }

  // ========================================
  // PUBLISH
  // ========================================

  function publishMessage() {
    if (!client || !client.connected) {
      alert("MQTT is not connected");
      return;
    }

    const topic = value("pubTopic").trim();
    const payload = value("pubPayload");

    if (!topic) {
      alert("Please enter topic");
      return;
    }

    client.publish(
      topic,
      payload,
      {
        qos: Number(value("pubQos")),
        retain: value("pubRetain") === "true"
      }
    );
  }

  // ========================================
  // HELPERS
  // ========================================

  function value(id) {
    return document.getElementById(id).value;
  }

  function setValue(id, val) {
    document.getElementById(id).value =
      val || "";
  }

  function setStatus(text, connected) {
    const el = document.getElementById("status");

    el.textContent = text;

    el.className =
      connected
        ? "connected"
        : "disconnected";
  }

  loadProfiles();
</script>

</body>
</html>
